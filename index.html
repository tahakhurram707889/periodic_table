<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table  | HTML, CSS & JAVASCRIPT</title>
    <link rel="shortcut icon" href="./assets/images/logo.png" type="image/x-icon"/>
    <link rel="stylesheet" href="style.css" >
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
</head>
<body>
    <div class="main-container">
        <header>
            <div class="brand-info">
                <a href="./assets/images/logo.png">
                    <img src="./assets/images/logo.png" alt="logo" title="logo" loading="lazy" />
                </a>
            </div>
            <div class="menu-area">
                <input type="checkbox" name="" id="menu-toggle" hidden />
                <label for="menu-toggle" class="menu-icon"><i class="ph ph-text-outdent"></i></label>
                <label for="menu-toggle" id="overlay"></label>
            </div>
        </header>

        <section class="content active">
            <div class="periodic-wrapper">
                <h2>Periodic <span>Table</span></h2>
                <p class="periodic-note">Interactive Periodic Table - Click elements for details</p>
                <div class="periodic-table" id="periodicTable"></div>
            </div>
        </section>
    </div>

    <script type="module" defer>
        const elements = [
            // Period 1
            {s:'H',n:'Hydrogen',a:1,g:'nonmetal'},
            ...Array(16).fill({empty:true}),
            {s:'He',n:'Helium',a:2,g:'noble'},
            // Period 2
            {s:'Li',n:'Lithium',a:3,g:'alkali'},
            {s:'Be',n:'Beryllium',a:4,g:'alkaline'},
            ...Array(10).fill({empty:true}),
            {s:'B',n:'Boron',a:5,g:'metalloid'},
            {s:'C',n:'Carbon',a:6,g:'nonmetal'},
            {s:'N',n:'Nitrogen',a:7,g:'nonmetal'},
            {s:'O',n:'Oxygen',a:8,g:'nonmetal'},
            {s:'F',n:'Fluorine',a:9,g:'nonmetal'},
            {s:'Ne',n:'Neon',a:10,g:'noble'},
            // Period 3
            {s:'Na',n:'Sodium',a:11,g:'alkali'},
            {s:'Mg',n:'Magnesium',a:12,g:'alkaline'},
            ...Array(10).fill({empty:true}),
            {s:'Al',n:'Aluminium',a:13,g:'post-transition'},
            {s:'Si',n:'Silicon',a:14,g:'metalloid'},
            {s:'P',n:'Phosphorus',a:15,g:'nonmetal'},
            {s:'S',n:'Sulfur',a:16,g:'nonmetal'},
            {s:'Cl',n:'Chlorine',a:17,g:'nonmetal'},
            {s:'Ar',n:'Argon',a:18,g:'noble'},
            // Period 4
            {s:'K',n:'Potassium',a:19,g:'alkali'},
            {s:'Ca',n:'Calcium',a:20,g:'alkaline'},
            {s:'Sc',n:'Scandium',a:21,g:'transition'},
            {s:'Ti',n:'Titanium',a:22,g:'transition'},
            {s:'V',n:'Vanadium',a:23,g:'transition'},
            {s:'Cr',n:'Chromium',a:24,g:'transition'},
            {s:'Mn',n:'Manganese',a:25,g:'transition'},
            {s:'Fe',n:'Iron',a:26,g:'transition'},
            {s:'Co',n:'Cobalt',a:27,g:'transition'},
            {s:'Ni',n:'Nickel',a:28,g:'transition'},
            {s:'Cu',n:'Copper',a:29,g:'transition'},
            {s:'Zn',n:'Zinc',a:30,g:'transition'},
            {s:'Ga',n:'Gallium',a:31,g:'post-transition'},
            {s:'Ge',n:'Germanium',a:32,g:'metalloid'},
            {s:'As',n:'Arsenic',a:33,g:'metalloid'},
            {s:'Se',n:'Selenium',a:34,g:'nonmetal'},
            {s:'Br',n:'Bromine',a:35,g:'nonmetal'},
            {s:'Kr',n:'Krypton',a:36,g:'noble'},
            // Period 5
            {s:'Rb',n:'Rubidium',a:37,g:'alkali'},
            {s:'Sr',n:'Strontium',a:38,g:'alkaline'},
            {s:'Y',n:'Yttrium',a:39,g:'transition'},
            {s:'Zr',n:'Zirconium',a:40,g:'transition'},
            {s:'Nb',n:'Niobium',a:41,g:'transition'},
            {s:'Mo',n:'Molybdenum',a:42,g:'transition'},
            {s:'Tc',n:'Technetium',a:43,g:'transition'},
            {s:'Ru',n:'Ruthenium',a:44,g:'transition'},
            {s:'Rh',n:'Rhodium',a:45,g:'transition'},
            {s:'Pd',n:'Palladium',a:46,g:'transition'},
            {s:'Ag',n:'Silver',a:47,g:'transition'},
            {s:'Cd',n:'Cadmium',a:48,g:'transition'},
            {s:'In',n:'Indium',a:49,g:'post-transition'},
            {s:'Sn',n:'Tin',a:50,g:'post-transition'},
            {s:'Sb',n:'Antimony',a:51,g:'metalloid'},
            {s:'Te',n:'Tellurium',a:52,g:'metalloid'},
            {s:'I',n:'Iodine',a:53,g:'nonmetal'},
            {s:'Xe',n:'Xenon',a:54,g:'noble'},
            // Period 6
            {s:'Cs',n:'Cesium',a:55,g:'alkali'},
            {s:'Ba',n:'Barium',a:56,g:'alkaline'},
            {s:'La',n:'Lanthanum',a:57,g:'lanthanide'},
            {s:'Hf',n:'Hafnium',a:72,g:'transition'},
            {s:'Ta',n:'Tantalum',a:73,g:'transition'},
            {s:'W',n:'Tungsten',a:74,g:'transition'},
            {s:'Re',n:'Rhenium',a:75,g:'transition'},
            {s:'Os',n:'Osmium',a:76,g:'transition'},
            {s:'Ir',n:'Iridium',a:77,g:'transition'},
            {s:'Pt',n:'Platinum',a:78,g:'transition'},
            {s:'Au',n:'Gold',a:79,g:'transition'},
            {s:'Hg',n:'Mercury',a:80,g:'transition'},
            {s:'Tl',n:'Thallium',a:81,g:'post-transition'},
            {s:'Pb',n:'Lead',a:82,g:'post-transition'},
            {s:'Bi',n:'Bismuth',a:83,g:'post-transition'},
            {s:'Po',n:'Polonium',a:84,g:'post-transition'},
            {s:'At',n:'Astatine',a:85,g:'metalloid'},
            {s:'Rn',n:'Radon',a:86,g:'noble'},
            // Period 7
            {s:'Fr',n:'Francium',a:87,g:'alkali'},
            {s:'Ra',n:'Radium',a:88,g:'alkaline'},
            {s:'Ac',n:'Actinium',a:89,g:'actinide'},
            {s:'Rf',n:'Rutherfordium',a:104,g:'transition'},
            {s:'Db',n:'Dubnium',a:105,g:'transition'},
            {s:'Sg',n:'Seaborgium',a:106,g:'transition'},
            {s:'Bh',n:'Bohrium',a:107,g:'transition'},
            {s:'Hs',n:'Hassium',a:108,g:'transition'},
            {s:'Mt',n:'Meitnerium',a:109,g:'unknown'},
            {s:'Ds',n:'Darmstadtium',a:110,g:'unknown'},
            {s:'Rg',n:'Roentgenium',a:111,g:'unknown'},
            {s:'Cn',n:'Copernicium',a:112,g:'transition'},
            {s:'Nh',n:'Nihonium',a:113,g:'unknown'},
            {s:'Fl',n:'Flerovium',a:114,g:'unknown'},
            {s:'Mc',n:'Moscovium',a:115,g:'unknown'},
            {s:'Lv',n:'Livermorium',a:116,g:'unknown'},
            {s:'Ts',n:'Tennessine',a:117,g:'unknown'},
            {s:'Og',n:'Oganesson',a:118,g:'unknown'},
            // Lanthanides
            ...Array(18).fill({empty:true}),
            {s:'Ce',n:'Cerium',a:58,g:'lanthanide'},
            {s:'Pr',n:'Praseodymium',a:59,g:'lanthanide'},
            {s:'Nd',n:'Neodymium',a:60,g:'lanthanide'},
            {s:'Pm',n:'Promethium',a:61,g:'lanthanide'},
            {s:'Sm',n:'Samarium',a:62,g:'lanthanide'},
            {s:'Eu',n:'Europium',a:63,g:'lanthanide'},
            {s:'Gd',n:'Gadolinium',a:64,g:'lanthanide'},
            {s:'Tb',n:'Terbium',a:65,g:'lanthanide'},
            {s:'Dy',n:'Dysprosium',a:66,g:'lanthanide'},
            {s:'Ho',n:'Holmium',a:67,g:'lanthanide'},
            {s:'Er',n:'Erbium',a:68,g:'lanthanide'},
            {s:'Tm',n:'Thulium',a:69,g:'lanthanide'},
            {s:'Yb',n:'Ytterbium',a:70,g:'lanthanide'},
            {s:'Lu',n:'Lutetium',a:71,g:'lanthanide'},
            ...Array(2).fill({empty:true}),
            // Actinides
            {s:'Th',n:'Thorium',a:90,g:'actinide'},
            {s:'Pa',n:'Protactinium',a:91,g:'actinide'},
            {s:'U',n:'Uranium',a:92,g:'actinide'},
            {s:'Np',n:'Neptunium',a:93,g:'actinide'},
            {s:'Pu',n:'Plutonium',a:94,g:'actinide'},
            {s:'Am',n:'Americium',a:95,g:'actinide'},
            {s:'Cm',n:'Curium',a:96,g:'actinide'},
            {s:'Bk',n:'Berkelium',a:97,g:'actinide'},
            {s:'Cf',n:'Californium',a:98,g:'actinide'},
            {s:'Es',n:'Einsteinium',a:99,g:'actinide'},
            {s:'Fm',n:'Fermium',a:100,g:'actinide'},
            {s:'Md',n:'Mendelevium',a:101,g:'actinide'},
            {s:'No',n:'Nobelium',a:102,g:'actinide'},
            {s:'Lr',n:'Lawrencium',a:103,g:'actinide'},
        ];

        const table = document.getElementById('periodicTable');
        elements.forEach(el => {
            const div = document.createElement('div');
            if (el.empty) {
                div.className = 'element empty';
            } else {
                div.className = `element ${el.g}`;
                div.innerHTML = `
                    <div class="element-atomic">${el.a}</div>
                    <div class="element-symbol">${el.s}</div>
                    <div class="element-name">${el.n}</div>
                `;
                div.onclick = () => alert(`${el.n} (${el.s})\nAtomic Number: ${el.a}\nGroup: ${el.g.replace('-',' ')}`);
            }
            table.appendChild(div);
        });
    </script>
    
</body>
</html>
